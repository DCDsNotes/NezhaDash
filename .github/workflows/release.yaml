name: Build and release static export
run-name: Release ${{ inputs.tag || 'timestamp' }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "由主控传入的 v年月日时分秒 标签；直接手动运行时留空"
        required: false
        type: string

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve timestamp tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="\${REQUESTED_TAG:-}"
          if [[ -z "$tag" ]]; then
            tag="v$(TZ=Asia/Shanghai date +%Y%m%d%H%M%S)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]{14}$ ]]; then
            echo "::error::Tag must match vYYYYMMDDhhmmss"
            exit 1
          fi

          previous="$(gh release list --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[0].tagName // ""')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static export
        run: bun run build

      - name: Package dist.zip
        run: zip -qr dist.zip dist

      - name: Write release notes
        env:
          CURRENT_TAG: ${{ steps.release.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.release.outputs.previous }}
        shell: bash
        run: |
          if [[ -n "$PREVIOUS_TAG" ]]; then
            printf 'Full Changelog: %s...%s\n' "$PREVIOUS_TAG" "$CURRENT_TAG" > release-notes.md
          else
            printf 'Full Changelog: %s\n' "$CURRENT_TAG" > release-notes.md
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          files: dist.zip

      - name: Keep the five newest releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t old_releases < <(gh release list --repo "$GH_REPO" --limit 1000 \
            --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[5:][] | .tagName')
          for tag in "\${old_releases[@]}"; do
            [[ -n "$tag" ]] || continue
            gh release delete "$tag" --repo "$GH_REPO" --yes --cleanup-tag
          done

          mapfile -t timestamp_tags < <(gh api --paginate "repos/$GH_REPO/git/matching-refs/tags/v" \
            --jq '.[].ref | select(test("^refs/tags/v[0-9]{14}$"))' | sort -r)
          for index in "\${!timestamp_tags[@]}"; do
            (( index < 5 )) && continue
            ref="\${timestamp_tags[$index]#refs/}"
            gh api --method DELETE "repos/$GH_REPO/git/refs/$ref"
          done

      - name: Keep five workflow runs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set +e
          while true; do
            mapfile -t run_ids < <(gh api "repos/$GH_REPO/actions/runs?per_page=100" \
              --jq ".workflow_runs | map(select(.id != \${GITHUB_RUN_ID} and .status == \"completed\")) | sort_by(.created_at) | reverse | .[4:][] | .id")
            (( \${#run_ids[@]} > 0 )) || break
            deleted=0
            for run_id in "\${run_ids[@]}"; do
              if gh api --method DELETE "repos/$GH_REPO/actions/runs/$run_id"; then
                ((deleted += 1))
              fi
            done
            (( deleted > 0 )) || break
          done

name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: frontend-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Remove legacy workflow artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          mapfile -t artifact_ids < <(
            gh api --paginate "repos/${GH_REPO}/actions/artifacts?per_page=100" \
              --jq '.artifacts[].id'
          )

          for artifact_id in "${artifact_ids[@]}"; do
            gh api --method DELETE "repos/${GH_REPO}/actions/artifacts/${artifact_id}"
          done

          echo "Removed ${#artifact_ids[@]} legacy Actions artifact(s)." >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Resolve timestamp version
        id: version
        shell: bash
        run: |
          tag="v$(date -u +%Y%m%d%H%M%S)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        shell: bash
        run: |
          {
            echo "#### Changes"
            git log -20 --pretty=format:"%s"
            echo
            echo "-----------"
            echo "Artifact:"
            echo "- dist.zip"
          } > release_notes.md

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Package dist.zip
        shell: bash
        run: zip -r dist.zip dist

      - name: Create release and upload asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --title "Release ${RELEASE_TAG}" \
              --notes-file release_notes.md \
              --latest
            gh release upload "${RELEASE_TAG}" dist.zip --clobber
          else
            gh release create "${RELEASE_TAG}" dist.zip \
              --target "${GITHUB_SHA}" \
              --title "Release ${RELEASE_TAG}" \
              --notes-file release_notes.md \
              --latest
          fi

      - name: Keep only the five newest releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          mapfile -t releases < <(gh release list --repo "$GH_REPO" --limit 100 --json tagName,createdAt --jq '[.[] | select(.tagName | test("^v[0-9]{14}$"))] | sort_by(.createdAt) | reverse | .[5:][] | .tagName')
          mapfile -t legacy < <(gh release list --repo "$GH_REPO" --limit 100 --json tagName --jq '.[] | select(.tagName | test("^v[0-9]{14}$") | not) | .tagName')
          for tag in "${releases[@]}" "${legacy[@]}"; do
            [[ -n "$tag" ]] || continue
            gh release delete "$tag" --repo "$GH_REPO" --yes --cleanup-tag || true
          done
          echo "Retained the five newest frontend releases." >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger backend release build
        env:
          BACKEND_ACTIONS_TOKEN: ${{ secrets.NEZHA_ACTIONS_TOKEN }}
          BACKEND_REPOSITORY: ${{ github.repository_owner }}/Nezha
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if [[ -z "${BACKEND_ACTIONS_TOKEN}" ]]; then
            echo "Missing NEZHA_ACTIONS_TOKEN repository secret." >&2
            exit 1
          fi

          payload="$(jq -n --arg version "${RELEASE_TAG}" '{event_type:"frontend_release",client_payload:{version:$version}}')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${BACKEND_ACTIONS_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${BACKEND_REPOSITORY}/dispatches" \
            --data "${payload}"

name: Build and Release

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.9.1 or v0.9.1)"
        required: false

permissions:
  actions: write
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Remove legacy workflow artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          mapfile -t artifact_ids < <(
            gh api --paginate "repos/${GH_REPO}/actions/artifacts?per_page=100" \
              --jq '.artifacts[].id'
          )

          for artifact_id in "${artifact_ids[@]}"; do
            gh api --method DELETE "repos/${GH_REPO}/actions/artifacts/${artifact_id}"
          done

          echo "Removed ${#artifact_ids[@]} legacy Actions artifact(s)." >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Resolve version/tag
        id: version
        shell: bash
        run: |
          pkg_version="$(bun -p "require('./package.json').version")"
          input_version="${{ github.event.inputs.version }}"

          if [[ "${{ github.ref_type }}" == "tag" && -n "${{ github.ref_name }}" ]]; then
            tag="${{ github.ref_name }}"
          elif [[ -n "${input_version}" ]]; then
            if [[ "${input_version}" == v* ]]; then
              tag="${input_version}"
            else
              tag="v${input_version}"
            fi
          elif [[ "${{ github.ref_type }}" == "branch" ]]; then
            build_ts="$(TZ=Asia/Shanghai date +%Y%m%d%H%M%S)"
            tag="v${build_ts}"
          else
            tag="v${pkg_version}"
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        shell: bash
        run: |
          {
            echo "#### Changes"
            git log -20 --pretty=format:"%s"
            echo
            echo "-----------"
            echo "Artifact:"
            echo "- dist.zip"
          } > release_notes.md

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Package dist.zip
        shell: bash
        run: zip -r dist.zip dist

      - name: Create release and upload asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --title "Release ${RELEASE_TAG}" \
              --notes-file release_notes.md \
              --latest
            gh release upload "${RELEASE_TAG}" dist.zip --clobber
          else
            gh release create "${RELEASE_TAG}" dist.zip \
              --target "${GITHUB_SHA}" \
              --title "Release ${RELEASE_TAG}" \
              --notes-file release_notes.md \
              --latest
          fi

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>节点监控</title>
    <link id="app-favicon" rel="icon" type="image/svg+xml" href="/icon.svg?v=10" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg?v=10" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f8fafc" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="节点监控" />

    <style>
      #app-progress {
        --app-progress-value: 8%;
        position: fixed;
        inset: 0 0 auto;
        z-index: 100000;
        height: 3px;
        overflow: hidden;
        background: transparent;
        opacity: 0;
        transition: opacity 180ms ease 60ms;
      }
      #app-progress::after {
        display: block;
        width: var(--app-progress-value);
        height: 100%;
        background: #16a66a;
        content: "";
        transition: width 220ms ease;
      }
      #app-progress.is-loading {
        opacity: 1;
      }
      #app-progress.is-complete {
        opacity: 0;
      }
      #app-progress.is-complete::after {
        width: 100%;
      }
      .app-header-placeholder {
        min-height: 62px;
        border-bottom: 1px solid #e3e6e8;
        background: rgba(255, 255, 255, 0.96);
      }
      .app-header-placeholder__inner {
        display: flex;
        width: min(760px, calc(100% - 32px));
        min-height: 62px;
        align-items: center;
        gap: 10px;
        margin: 0 auto;
        color: #191b1f;
        font: 700 14px/1.25 "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      .app-header-placeholder__mark {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border-radius: 8px;
        background: #16a66a;
        color: #fff;
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <div id="app-progress" class="is-loading" role="progressbar" aria-label="页面加载进度"></div>
    <div id="root">
      <header class="app-header-placeholder" aria-hidden="true">
        <div class="app-header-placeholder__inner">
          <span class="app-header-placeholder__mark">N</span>
          <span>节点监控</span>
        </div>
      </header>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
